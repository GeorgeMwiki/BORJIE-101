# =============================================================================
# Strict CI — blocking lint / typecheck / test / build / e2e
# =============================================================================
# Full quality gate in BLOCKING mode and intended to become the canonical CI
# once legacy non-blocking issues are resolved. Until then, runs alongside
# the existing non-blocking ci.yml; required-status-check configuration can
# be toggled in branch protection.
# =============================================================================

name: Strict CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: strict-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (strict)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check (strict)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter='./packages/*' --filter='./services/*' build
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests (strict)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # `pnpm test` = `turbo run test`, and turbo's `test` task dependsOn `build`,
    # so it compiles the Next.js apps (marketing's `next build` asserts
    # NEXT_PUBLIC_MARKETING_SITE_URL). The build jobs set these; this turbo-test
    # job must too. `.invalid` host is an unresolvable placeholder, never fetched.
    env:
      NEXT_PUBLIC_APP_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_URL: https://ci-build.borjie.invalid/api
      NEXT_PUBLIC_API_GATEWAY_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_SITE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_ADMIN_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_PORTAL_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PLATFORM_PORTAL_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PDFJS_WORKER_URL: https://ci-build.borjie.invalid/pdf.worker.js
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-placeholder
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-build-placeholder
      NEXT_PUBLIC_WORKFORCE_APP_IOS_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_WORKFORCE_APP_ANDROID_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_BORJIE_ENV: ci
      NEXT_PUBLIC_TENANT_CURRENCY: TZS
      NEXT_PUBLIC_TENANT_LOCALE: en
      NEXT_PUBLIC_TENANT_COUNTRY: TZ
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter='./packages/*' --filter='./services/*' build || true
      - name: Run unit tests
        # `pnpm test` = `turbo run test`. Do NOT append `-- --reporter=verbose`:
        # the first `--` hands it to turbo, which rejects `--reporter`
        # ("unexpected argument"), failing the job. Passing it THROUGH turbo
        # (`-- -- --reporter`) would instead break packages whose test runner
        # isn't vitest (e.g. ai-reviewer's cac CLI rejects unknown options).
        run: pnpm test
        env:
          # Cap turbo concurrency + cap heap: the default (~10) OOM-crashes
          # vitest workers on the 2-core/7GB runner (passes in isolation).
          TURBO_CONCURRENCY: '2'
          NODE_OPTIONS: '--max-old-space-size=3072'
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: |
            **/coverage/**
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      NEXT_PUBLIC_APP_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_URL: https://ci-build.borjie.invalid/api
      NEXT_PUBLIC_API_GATEWAY_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_SITE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_ADMIN_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_PORTAL_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PLATFORM_PORTAL_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PDFJS_WORKER_URL: https://ci-build.borjie.invalid/pdf.worker.js
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-placeholder
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-build-placeholder
      NEXT_PUBLIC_WORKFORCE_APP_IOS_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_WORKFORCE_APP_ANDROID_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_BORJIE_ENV: ci
      NEXT_PUBLIC_TENANT_CURRENCY: TZS
      NEXT_PUBLIC_TENANT_LOCALE: sw
      NEXT_PUBLIC_TENANT_COUNTRY: TZ
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strict-build-node-${{ matrix.node-version }}
          path: |
            packages/*/dist
            apps/*/dist
            apps/*/.next
            services/*/dist
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright, strict)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - name: Seed test data
        run: pnpm tsx e2e/fixtures/seed-runner.ts
        env:
          DATABASE_URL: postgresql://borjie:borjie_e2e@localhost:55432/borjie_e2e
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright (all portal projects, real backend)
        run: pnpm test:e2e
        env:
          CI: 'true'
          API_GATEWAY_URL: http://localhost:4000
      - name: Capture stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs > e2e-stack-logs.txt
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-strict
          path: |
            e2e/e2e-report/
            e2e/test-results/
            playwright-report/
            e2e-stack-logs.txt
          retention-days: 14
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  strict-ci-success:
    name: Strict CI Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, e2e]
    steps:
      - run: echo "All strict CI jobs passed"
