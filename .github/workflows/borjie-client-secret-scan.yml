# =============================================================================
# Borjie Client Secret Scan
# =============================================================================
# Client-inspection hardening gate (2026-06-09). Owner directive: a buyer or a
# competitor must not be able to inspect / jailbreak the shipped web client and
# recover any secret, system prompt, persona, or proprietary constant — and no
# production source-maps may leak.
#
# This workflow builds the Next.js web apps and runs
# `scripts/check-client-bundle-clean.mjs` over each app's `.next/static` client
# output as a BLOCKING gate. It also runs the scanner's own unit test so the
# detector is proven on every PR (independent of the heavy Next build).
#
# Mirrors `borjie-security.yml` (security-prefix convention) and the build-job
# setup in `ci.yml` (pnpm/action-setup@v4 + setup-node@v6 + NEXT_PUBLIC_*
# placeholders so `next build` does not fail on the env-fail-fast guard).
# =============================================================================

name: Borjie Client Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: borjie-client-secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Prove the scanner itself (fast — no Next build needed).
  # ---------------------------------------------------------------------------
  scanner-unit-test:
    name: Scanner unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scanner unit test
        run: npx vitest run scripts/__tests__/check-client-bundle-clean.test.mjs

  # ---------------------------------------------------------------------------
  # 2. Build the web clients and assert their bundles are empty of secrets,
  #    prompt-IP, and source-maps.
  # ---------------------------------------------------------------------------
  client-bundle-scan:
    name: Client bundle scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: scanner-unit-test
    strategy:
      fail-fast: false
      matrix:
        app: [owner-web, admin-web]
    env:
      # NEXT_PUBLIC_* placeholders so `next build` clears its env-fail-fast
      # guard (see apps/*/src/lib/supabase/env.ts). These are intentionally
      # public, placeholder values — never real secrets.
      NEXT_PUBLIC_APP_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_URL: https://ci-build.borjie.invalid/api
      NEXT_PUBLIC_API_GATEWAY_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_SITE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_ADMIN_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_PORTAL_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PLATFORM_PORTAL_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PDFJS_WORKER_URL: https://ci-build.borjie.invalid/pdf.worker.js
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-placeholder
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-build-placeholder
      NEXT_PUBLIC_WORKFORCE_APP_IOS_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_WORKFORCE_APP_ANDROID_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_BORJIE_ENV: ci
      NEXT_PUBLIC_TENANT_CURRENCY: TZS
      NEXT_PUBLIC_TENANT_LOCALE: sw
      NEXT_PUBLIC_TENANT_COUNTRY: TZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }} (and its workspace deps)
        run: pnpm --filter @borjie/${{ matrix.app }}... build

      # Loud guard: a missing OR empty `.next/static` means the build was
      # skipped or produced no client output. That must NOT silently pass the
      # gate — fail the job before scanning. (The scanner ALSO exits 2 on this
      # condition; this step makes the failure explicit and self-describing.)
      - name: Assert client bundle dir exists and is non-empty
        run: |
          DIR="apps/${{ matrix.app }}/.next/static"
          if [ ! -d "$DIR" ]; then
            echo "::error::Client bundle dir '$DIR' does not exist — the build did not emit client output. Failing the secret-scan gate."
            exit 2
          fi
          COUNT="$(find "$DIR" -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Client bundle dir '$DIR' is empty — the build produced no client output. Failing the secret-scan gate."
            exit 2
          fi
          echo "Client bundle dir '$DIR' contains $COUNT file(s); proceeding to scan."

      # Exit codes: 0 = clean, 1 = leak found, 2 = missing/empty dir. Any
      # non-zero status fails the job (and thus the PR gate).
      - name: Scan built client bundle for secrets / prompt-IP / source-maps
        run: node scripts/check-client-bundle-clean.mjs apps/${{ matrix.app }}/.next/static
