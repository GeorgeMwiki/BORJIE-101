# =============================================================================
# Migration Apply (Fresh DB) — CI-enforced fresh-apply verifier.
# =============================================================================
# Strategy
#   1. Spin up Postgres 16 + pgvector (pgvector/pgvector:pg16).
#   2. Apply every *.sql under packages/database/src/migrations/ in lex
#      order via scripts/migration-apply-check.mjs.
#   3. Each migration runs with ON_ERROR_STOP=1 inside its own transaction.
#   4. PR-block on any ERROR/FATAL.
#   5. Post the markdown report as a PR comment.
# =============================================================================

name: Migration Apply (Fresh DB)

on:
  pull_request:
    paths:
      - 'packages/database/src/migrations/**'
      - 'packages/database/src/schemas/**'
      - 'packages/database/drizzle/**'
      - 'scripts/migration-apply-check.mjs'
      - 'scripts/check-schema-migration-coverage.mjs'
      - '.github/workflows/migration-apply-fresh.yml'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: migration-apply-fresh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  apply-fresh:
    name: Apply all migrations on a fresh DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://borjie:borjie@localhost:5432/borjie_apply_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Schema-to-migration drift gate. Pure static check (no DB needed), run
      # BEFORE the Postgres install so drift fails fast. Asserts every Drizzle
      # `pgTable('NAME', ...)` under packages/database/src/schemas/** has a
      # matching `CREATE TABLE [IF NOT EXISTS] NAME` somewhere under
      # packages/database/drizzle/** OR packages/database/src/migrations/**.
      # This is the gate that was missing when `core_entity`'s CREATE lived only
      # in an archived migration and was invisible on a fresh apply.
      - name: Schema → migration coverage (drift gate)
        run: |
          mkdir -p .audit
          node scripts/check-schema-migration-coverage.mjs \
            --report=.audit/schema-migration-coverage.json

      # Runner-installed Postgres 17 with BOTH PostGIS and pgvector. The previous
      # `pgvector/pgvector:pg16` service container shipped pgvector but NOT
      # postgis, so the 0000 baseline (CREATE EXTENSION postgis) failed and
      # every downstream migration cascaded. This mirrors the sibling
      # migration-apply-check.yml (and Supabase, which ships both natively).
      - name: Install + start PostgreSQL 17 + PostGIS + pgvector (PGDG)
        run: |
          set -e
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-postgis-3 postgresql-17-pgvector
          sudo systemctl stop postgresql 2>/dev/null || true
          for v in 16 17; do sudo pg_dropcluster --stop "$v" main 2>/dev/null || true; done
          sudo pg_createcluster 17 main -p 5432 -- --auth-local=trust --auth-host=trust
          sudo pg_ctlcluster 17 main start
          for i in $(seq 1 30); do sudo -u postgres pg_isready -p 5432 >/dev/null 2>&1 && break; sleep 1; done
          sudo -u postgres psql -p 5432 -v ON_ERROR_STOP=1 -c "CREATE ROLE borjie LOGIN SUPERUSER PASSWORD 'borjie'"
          sudo -u postgres psql -p 5432 -v ON_ERROR_STOP=1 -c "CREATE DATABASE borjie_apply_test OWNER borjie"
          echo "PostgreSQL 17 + PostGIS + pgvector ready on :5432"

      - name: Try CREATE EXTENSION vector + postgis (best-effort)
        run: |
          for ext in vector postgis postgis_topology pgcrypto "uuid-ossp" pg_trgm citext btree_gist; do
            PGPASSWORD=borjie psql -h localhost -p 5432 -U borjie -d borjie_apply_test \
              -c "CREATE EXTENSION IF NOT EXISTS \"${ext}\"" 2>&1 | tail -1 || \
              echo "::warning::extension ${ext} not available"
          done

      - name: Seed Supabase roles (authenticated, anon, service_role)
        env:
          PGPASSWORD: borjie
        run: |
          psql -h localhost -p 5432 -U borjie -d borjie_apply_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          SQL

      - name: Apply all migrations and capture errors
        id: apply
        env:
          PGPASSWORD: borjie
        run: |
          mkdir -p .audit
          set +e
          node scripts/migration-apply-check.mjs \
            --db-url="$DATABASE_URL" \
            --migrations-dir=packages/database/src/migrations \
            --enable-vector=true \
            --report=.audit/migration-apply-fresh.md
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f .audit/migration-apply-fresh.md ]; then
            {
              echo "## Migration Apply (Fresh DB)"
              echo ""
              cat .audit/migration-apply-fresh.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-apply-fresh-report
          path: .audit/migration-apply-fresh.md
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = '.audit/migration-apply-fresh.md';
            if (!fs.existsSync(path)) return;
            const body = '## Migration Apply (Fresh DB)\n\n' + fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (c) =>
                c.user.type === 'Bot' &&
                c.body.startsWith('## Migration Apply (Fresh DB)'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Enforce zero ERROR/FATAL
        run: |
          code="${{ steps.apply.outputs.exitcode }}"
          if [ "$code" -eq 0 ]; then
            echo "Migration apply (fresh DB): PASS"
          elif [ "$code" -eq 1 ]; then
            echo "::error::Migration apply (fresh DB): one or more migrations errored on fresh apply"
            exit 1
          else
            echo "::error::Migration apply harness crashed (exit $code)"
            exit "$code"
          fi
