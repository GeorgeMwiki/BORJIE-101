# BORJIE Pull Request Checks
# Enforced quality gates for all PRs

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* are required at build time by the Next.js apps (marketing
    # /robots.txt asserts NEXT_PUBLIC_MARKETING_SITE_URL in production builds).
    # `.invalid` host is a guaranteed-unresolvable placeholder — never fetched.
    env:
      NEXT_PUBLIC_APP_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_URL: https://ci-build.borjie.invalid/api
      NEXT_PUBLIC_API_GATEWAY_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_SITE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_ADMIN_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_PORTAL_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PLATFORM_PORTAL_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PDFJS_WORKER_URL: https://ci-build.borjie.invalid/pdf.worker.js
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-placeholder
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-build-placeholder
      NEXT_PUBLIC_WORKFORCE_APP_IOS_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_WORKFORCE_APP_ANDROID_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_BORJIE_ENV: ci
      NEXT_PUBLIC_TENANT_CURRENCY: TZS
      NEXT_PUBLIC_TENANT_LOCALE: sw
      NEXT_PUBLIC_TENANT_COUNTRY: TZ
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm exec turbo run build --filter='./packages/*' --filter='./services/*'

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm -r --filter='./packages/*' --filter='./services/*' --filter='./apps/*' test

      - name: Build
        run: pnpm build

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (allowlist-aware)
        run: node scripts/audit-with-allowlist.mjs

  size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    # Full `pnpm build` (turbo) compiles the Next.js apps too; marketing's
    # /robots.txt route requires NEXT_PUBLIC_MARKETING_SITE_URL at build time.
    env:
      NEXT_PUBLIC_APP_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_URL: https://ci-build.borjie.invalid/api
      NEXT_PUBLIC_API_GATEWAY_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_API_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_SITE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_MARKETING_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_ADMIN_WEB_ORIGIN: https://ci-build.borjie.invalid
      NEXT_PUBLIC_OWNER_PORTAL_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PLATFORM_PORTAL_BASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_PDFJS_WORKER_URL: https://ci-build.borjie.invalid/pdf.worker.js
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-placeholder
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-build-placeholder
      NEXT_PUBLIC_WORKFORCE_APP_IOS_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_WORKFORCE_APP_ANDROID_URL: https://ci-build.borjie.invalid
      NEXT_PUBLIC_BORJIE_ENV: ci
      NEXT_PUBLIC_TENANT_CURRENCY: TZS
      NEXT_PUBLIC_TENANT_LOCALE: sw
      NEXT_PUBLIC_TENANT_COUNTRY: TZ
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Report bundle sizes
        run: |
          echo "## Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find packages apps -name "dist" -type d 2>/dev/null | while read dir; do
            size=$(du -sh "$dir" 2>/dev/null | cut -f1)
            echo "- $dir: $size" >> $GITHUB_STEP_SUMMARY
          done || echo "No dist directories found" >> $GITHUB_STEP_SUMMARY

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [conventional-commits, quality, security, size]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.conventional-commits.result }}" == "failure" ]] || \
             [[ "${{ needs.quality.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All checks passed!"
