# BORJIE Production Deployment
# Deploys to production on release publish

name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to deploy'
        required: true

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

# `id-token: write` enables OIDC assume-role for the Terraform AWS provider
# (no long-lived AWS keys).
permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  build:
    name: Build Apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [marketing, owner-web, admin-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm -r --filter=./apps/${{ matrix.app }} build

      - name: Upload ${{ matrix.app }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/dist
            apps/${{ matrix.app }}/.next
          retention-days: 14

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all app artifacts
        uses: actions/download-artifact@v8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy to production (Terraform)
        run: |
          cd infra/terraform
          terraform init -input=false
          terraform workspace select production || terraform workspace new production
          terraform plan -var="environment=production" -out=tfplan
          terraform apply -auto-approve tfplan
        env:
          AWS_REGION: eu-west-1

      - name: Run database migrations (baseline-first, gated)
        # Applies the drizzle/ baseline THEN src/migrations/ via the canonical
        # baseline-first runner (packages/database/src/run-migrations.ts). MUST
        # succeed before app cutover — without this a live-looking gateway
        # serves against an un-migrated / drifted schema. Requires the
        # PRODUCTION_DATABASE_URL secret (prod DB reachable from the runner).
        run: pnpm -C packages/database run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed for all apps" >> $GITHUB_STEP_SUMMARY
          echo "Release: ${{ github.event.release.tag_name || 'manual' }}" >> $GITHUB_STEP_SUMMARY

  health-checks:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run health checks
        # Fails the deploy (and thus the Slack notify status) if the gateway
        # is not actually serving. Requires the PRODUCTION_URL repo variable.
        run: |
          echo "Running health checks against ${{ vars.PRODUCTION_URL }}..."
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "${{ vars.PRODUCTION_URL }}/health" \
            || { echo "::error::gateway /health failed"; exit 1; }
          # NOTE: the deep cascade lives at /api/v1/health/deep and is
          # admin-JWT-gated (403 unauthenticated), so an anonymous runner
          # cannot probe it. /healthz is the public k8s-style liveness twin.
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "${{ vars.PRODUCTION_URL }}/healthz" \
            || { echo "::error::gateway /healthz failed"; exit 1; }

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy, health-checks]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "BORJIE Production Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment* ${{ job.status }}\n*Release:* ${{ github.event.release.tag_name || 'manual' }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }
        continue-on-error: true
