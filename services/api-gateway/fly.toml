# =============================================================================
# Fly.io configuration for @borjie/api-gateway
# =============================================================================
# Region: lhr (London) — colocated with the live Supabase cluster
# (aws-1-eu-west-2). The gateway makes many sequential DB round trips per
# request; users pay ONE RTT to the gateway, so gateway↔DB latency dominates.
# Database: live Supabase (NOT Fly Postgres — do not `fly pg attach`).
# Build context: monorepo root. Deploy with
#   fly deploy . -c services/api-gateway/fly.toml --remote-only
# (dockerfile below resolves relative to THIS file's directory).
# =============================================================================

app = "borjie-api-gateway"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  OTEL_SERVICE_NAME = "borjie-api-gateway"

[experimental]
  auto_rollback = true

# -- Public HTTP service --------------------------------------------------------
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# -- VM sizing -----------------------------------------------------------------
# 2 GB floor: the gateway is the whole modular monolith in one process — the
# 18+ MB bundled service graph, ~28 in-process crons, the brain kernel and the
# notification drain. A 512 MB machine OOM-loops before finishing boot.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

# -- Persistent storage --------------------------------------------------------
# Postgres data is managed by Fly Postgres (separate app). This mount stores
# local cache + ephemeral upload spool only.
[mounts]
  source = "borjie_api_gateway_data"
  destination = "/data"
  initial_size = "1gb"

[processes]
  app = "node dist/index.js"

[metrics]
  port = 9091
  path = "/metrics"
