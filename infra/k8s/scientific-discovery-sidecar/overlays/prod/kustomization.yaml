apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: borjie-prod

resources:
  - ../../base

images:
  - name: ghcr.io/georgemwiki/borjie-scientific-discovery-sidecar
    newTag: ${IMAGE_TAG}

patches:
  - target:
      kind: Deployment
      name: scientific-discovery-sidecar
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: scientific-discovery-sidecar
              topologyKey: kubernetes.io/hostname
  # SEC-4 — gVisor (runsc) kernel-level isolation. This sidecar runs heavy
  # third-party numerical code (DoWhy / Tigramite / EconML); wrapping it in
  # the gVisor application-kernel adds the missing kernel-isolation layer so
  # a native-code exploit cannot escape to the node. The RuntimeClass is
  # defined in infra/k8s/base/runtimeclass-gvisor.yaml and scheduled onto
  # the gVisor node pool. CONDITIONAL by design: a cluster without the
  # `gvisor` RuntimeClass provisioned leaves these pods Pending — so this
  # is applied as an overlay patch (not in base), keeping clusters without
  # runsc bootable. Matches MEMORY:borjie-agent-isolation-security.
  - target:
      kind: Deployment
      name: scientific-discovery-sidecar
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
