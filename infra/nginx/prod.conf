# =============================================================================
# BORJIE — Nginx reverse proxy (Phase F.6 docker-compose.production.yml)
# =============================================================================
# TLS termination + HTTPS-only routing for the self-hosted production stack.
# Certbot writes to /etc/letsencrypt; the `certbot-webroot` volume mounts the
# ACME http-01 challenge dir at /var/www/certbot.
#
# Canonical production hosts (all under the apex borjie.co.tz so the Supabase
# auth session cookie can be issued on the shared `.borjie.co.tz` domain and
# cross the marketing → owner-cockpit origins):
#
# Domain layout (override via CERTBOT_DOMAINS):
#   borjie.co.tz, www.borjie.co.tz  -> marketing   (public bilingual sw/en site)
#   app.borjie.co.tz                -> owner-web    (mining owner strategic cockpit)
#   console.borjie.co.tz            -> admin-web    (Borjie team internal console)
#   api.borjie.co.tz                -> api-gateway:4000 (Hono BFF — REST + SSE)
#
# The two Expo apps (workforce-mobile, buyer-mobile) ship through the app
# stores and talk to api.borjie.co.tz directly; they are not proxied here.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens off;

    # ---- TLS posture --------------------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---- Logging ------------------------------------------------------------
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes_sent":$bytes_sent,"req_time":$request_time,'
        '"upstream_time":"$upstream_response_time","ua":"$http_user_agent",'
        '"referer":"$http_referer"}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    # ---- Security headers (applied via map below + add_header in servers) --
    map $sent_http_content_type $cache_control {
        default                                 "no-cache, no-store, must-revalidate";
        ~^image/                                "public, max-age=31536000, immutable";
        ~^font/                                 "public, max-age=31536000, immutable";
        ~^application/javascript                "public, max-age=31536000, immutable";
        ~^text/css                              "public, max-age=31536000, immutable";
    }

    # ---- Rate limiting ------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ---- Upstreams ----------------------------------------------------------
    # api-gateway listens on :4000; the Next.js app containers on :3000.
    upstream api_gateway        { server api-gateway:4000;        keepalive 32; }
    upstream marketing_app      { server marketing:3000;          keepalive 32; }
    upstream owner_web          { server owner-web:3000;          keepalive 32; }
    upstream admin_web          { server admin-web:3000;          keepalive 32; }

    # =========================================================================
    # HTTP -> HTTPS redirect + ACME challenge passthrough
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # api.borjie.co.tz -> api-gateway (REST + SSE)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.borjie.co.tz;

        ssl_certificate     /etc/letsencrypt/live/api.borjie.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.borjie.co.tz/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        client_max_body_size 25m;
        limit_conn conn 64;

        # SSE endpoints need streaming (no buffering) + long-lived connections.
        proxy_buffering off;
        proxy_cache     off;

        location /api/v1/auth/ {
            limit_req zone=auth_rl burst=10 nodelay;
            proxy_pass http://api_gateway;
            include /etc/nginx/proxy_params_inline;
        }

        location / {
            limit_req zone=api_rl burst=40 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    # =========================================================================
    # borjie.co.tz, www.borjie.co.tz -> marketing (public bilingual sw/en site)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name borjie.co.tz www.borjie.co.tz;

        ssl_certificate     /etc/letsencrypt/live/borjie.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/borjie.co.tz/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            limit_req zone=api_rl burst=40 nodelay;
            proxy_pass http://marketing_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # =========================================================================
    # app.borjie.co.tz -> owner-web (mining owner strategic cockpit)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.borjie.co.tz;

        ssl_certificate     /etc/letsencrypt/live/borjie.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/borjie.co.tz/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            proxy_pass http://owner_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # =========================================================================
    # console.borjie.co.tz -> admin-web (Borjie team internal console)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name console.borjie.co.tz;

        ssl_certificate     /etc/letsencrypt/live/borjie.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/borjie.co.tz/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_pass http://admin_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
